name: Update profile cards

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars,contribs&hide_border=true&bg_color=00000000&title_color=A78BFA&icon_color=A78BFA&text_color=C9D1D9&ring_color=A78BFA
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate public work card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=shadow-ai-sw4-candidate-solution&hide_border=true&bg_color=00000000&title_color=A78BFA&icon_color=A78BFA&text_color=C9D1D9
          path: assets/public-work.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/public-work.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile cards"
          git push
