    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill: #b7ad3c; }
    .hello { font-size: 23px; }
    .line { font-size: 22px; }
  </style>
  <text x="360" y="36" text-anchor="middle" class="hello">Hello hello</text>
